<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.h{font-size:17px;font-weight:700}.b{font-size:14px}.line{stroke:#1769aa;stroke-width:2}.dash{stroke:#777;stroke-width:1.5;stroke-dasharray:6 5}.act{fill:#d8eaff;stroke:#1769aa;stroke-width:1}.box{fill:#e8f3ff;stroke:#1473c9;stroke-width:2}</style><rect x="15" y="15" width="1570" height="55" rx="8" fill="#075a9c"/><text x="35" y="51" class="title" style="fill:white">UML Sequence Diagram — Customer Books 1 Seat and Pays by UPI</text><text x="80" y="95" class="h" text-anchor="middle">Customer</text><text x="250" y="95" class="h" text-anchor="middle">Cinema</text><text x="440" y="95" class="h" text-anchor="middle">BookingService</text><text x="630" y="95" class="h" text-anchor="middle">Show</text><text x="820" y="95" class="h" text-anchor="middle">ShowSeat</text><text x="1010" y="95" class="h" text-anchor="middle">PriceCalculator</text><text x="1200" y="95" class="h" text-anchor="middle">UPI Payment</text><text x="1370" y="95" class="h" text-anchor="middle">Booking</text><text x="1520" y="95" class="h" text-anchor="middle">TicketPrinter</text><g class="dash"><line x1="80" y1="110" x2="80" y2="820"/><line x1="250" y1="110" x2="250" y2="820"/><line x1="440" y1="110" x2="440" y2="820"/><line x1="630" y1="110" x2="630" y2="820"/><line x1="820" y1="110" x2="820" y2="820"/><line x1="1010" y1="110" x2="1010" y2="820"/><line x1="1200" y1="110" x2="1200" y2="820"/><line x1="1370" y1="110" x2="1370" y2="820"/><line x1="1520" y1="110" x2="1520" y2="820"/></g><g class="act"><rect x="433" y="190" width="14" height="560"/><rect x="623" y="300" width="14" height="70"/><rect x="813" y="400" width="14" height="70"/><rect x="1003" y="500" width="14" height="70"/><rect x="1193" y="600" width="14" height="70"/><rect x="1363" y="700" width="14" height="80"/><rect x="1513" y="760" width="14" height="50"/></g><g class="line"><line x1="80" y1="150" x2="250" y2="150"/><line x1="250" y1="200" x2="440" y2="200"/><line x1="440" y1="250" x2="630" y2="250"/><line x1="440" y1="350" x2="820" y2="350"/><line x1="440" y1="450" x2="1010" y2="450"/><line x1="440" y1="550" x2="1200" y2="550"/><line x1="440" y1="650" x2="1370" y2="650"/><line x1="440" y1="750" x2="1520" y2="750"/><line x1="440" y1="810" x2="80" y2="810"/></g><g class="h"><text x="165" y="142">1. selectMovie()</text><text x="345" y="192">2. listMovies()</text><text x="500" y="242">4. selectShow()</text><text x="620" y="342">8. checkAvailability()</text><text x="720" y="442">10. calculateTotal()</text><text x="820" y="542">12. pay(150)</text><text x="905" y="642">14. createBooking()</text><text x="1030" y="742">17. printTicket()</text><text x="220" y="802">19. bookingConfirmed()</text></g><g fill="#1769aa"><polygon points="250,150 238,144 238,156"/><polygon points="440,200 428,194 428,206"/><polygon points="630,250 618,244 618,256"/><polygon points="820,350 808,344 808,356"/><polygon points="1010,450 998,444 998,456"/><polygon points="1200,550 1188,544 1188,556"/><polygon points="1370,650 1358,644 1358,656"/><polygon points="1520,750 1508,744 1508,756"/><polygon points="80,810 92,804 92,816"/></g><g class="b"><text x="35" y="850">Flow: movie selection → show selection → seat availability → price calculation (Silver ₹150) → UPI payment → booking creation/confirmation → ticket printing.</text></g></svg>